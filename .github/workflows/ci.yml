# Type-checks and builds both halves of the extension: the Node side that
# tsc emits, and the webview esbuild bundles (which esbuild does not
# type-check, so tsconfig.rf.json is a step of its own).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Compile (tsc + esbuild)
        run: npm run compile

      - name: Type-check the webview
        run: npm run check:rf

      - name: Fetch lhatls for parser-backed tests
        run: |
          version="$(tr -d '[:space:]' < .lhat-version)"
          server_dir="$RUNNER_TEMP/lhatls"
          mkdir -p "$server_dir"
          gh release download "$version" --repo SAM-tak/lhat \
            --pattern lhatls-linux-x64.tar.gz --output "$server_dir/pack.tar.gz"
          tar -C "$server_dir" -xzf "$server_dir/pack.tar.gz"
          chmod +x "$server_dir/lhatls"
          echo "LHAT_TEST_SERVER=$server_dir/lhatls" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Graph mapping and syntax highlighting tests
        run: npm test
